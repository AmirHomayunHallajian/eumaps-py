[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eumaps-py"
version = "0.1.0"
description = "Publication-ready EU and NUTS choropleth maps in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amir-Homayun Hallajian" }
]
keywords = ["europe", "eurostat", "gisco", "nuts", "geopandas", "choropleth", "maps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "mapclassify>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]
interactive = [
    "plotly>=5.18",
]

[tool.setuptools]
packages = ["eumaps"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100

